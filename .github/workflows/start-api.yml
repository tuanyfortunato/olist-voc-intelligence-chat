# Liga o banco e a API fora do horário (9h às 22h, horário de Brasília), por
# exemplo para gravar o vídeo. O agendamento das 22h desliga os dois de novo.
name: Start API

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: Acesso à AWS pelo OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Ler os nomes dos recursos no Terraform
        working-directory: infra
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" > /dev/null
          terraform output -json > ../outputs.json
          for name in ecs_cluster_name ecs_service_name cloudfront_url; do
            echo "$(echo "$name" | tr a-z A-Z)=$(jq -r ".${name}.value" ../outputs.json)" >> "$GITHUB_ENV"
          done

      - name: Ligar o banco
        run: |
          STATUS=$(aws rds describe-db-instances --db-instance-identifier olist-voc-db --query 'DBInstances[0].DBInstanceStatus' --output text)
          echo "Banco: $STATUS"
          if [ "$STATUS" = "stopped" ]; then
            aws rds start-db-instance --db-instance-identifier olist-voc-db > /dev/null
          fi
          # Leva de 5 a 10 minutos quando estava desligado
          aws rds wait db-instance-available --db-instance-identifier olist-voc-db
          echo "Banco disponível"

      - name: Ligar a API
        run: |
          aws application-autoscaling register-scalable-target \
            --service-namespace ecs \
            --resource-id "service/$ECS_CLUSTER_NAME/$ECS_SERVICE_NAME" \
            --scalable-dimension ecs:service:DesiredCount \
            --min-capacity 1 --max-capacity 1
          aws ecs wait services-stable --cluster "$ECS_CLUSTER_NAME" --services "$ECS_SERVICE_NAME"

      - name: Teste rápido
        run: curl -fsS --retry 10 --retry-delay 10 "$CLOUDFRONT_URL/api/health"
