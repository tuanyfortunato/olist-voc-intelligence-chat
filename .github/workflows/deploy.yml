# Publicação: imagem da API no ECR, nova revisão da tarefa no ECS, página no S3
# e cache do CloudFront invalidado. Roda depois de cada aplicação do Terraform
# na main, e também pode ser disparado à mão escolhendo a branch.
name: Deploy

on:
  workflow_run:
    workflows: [Terraform]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: Acesso à AWS pelo OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Ler os nomes dos recursos no Terraform
        working-directory: infra
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" > /dev/null
          terraform output -json > ../outputs.json
          for name in ecr_repository_url ecs_cluster_name ecs_service_name task_family frontend_bucket cloudfront_distribution_id cloudfront_url; do
            echo "$(echo "$name" | tr a-z A-Z)=$(jq -r ".${name}.value" ../outputs.json)" >> "$GITHUB_ENV"
          done

      - name: Conferir que os embeddings existem no S3
        run: |
          aws s3 ls "s3://${{ vars.INDEX_BUCKET }}/index/current/manifest.json" > /dev/null \
            || { echo "Não há embeddings em s3://${{ vars.INDEX_BUCKET }}/index/current/. Rode o workflow Build index."; exit 1; }

      - name: Construir e enviar a imagem
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URL%%/*}"
          docker build -t "$ECR_REPOSITORY_URL:${{ github.sha }}" -t "$ECR_REPOSITORY_URL:latest" .
          docker push --all-tags "$ECR_REPOSITORY_URL"

      - name: Nova revisão da tarefa com a imagem nova
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query taskDefinition > task.json
          jq --arg image "$ECR_REPOSITORY_URL:${{ github.sha }}" \
            '.containerDefinitions[0].image = $image
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task.json > new-task.json
          ARN=$(aws ecs register-task-definition --cli-input-json file://new-task.json --query taskDefinition.taskDefinitionArn --output text)
          aws ecs update-service --cluster "$ECS_CLUSTER_NAME" --service "$ECS_SERVICE_NAME" --task-definition "$ARN" > /dev/null
          echo "Nova revisão: $ARN"

      - name: Esperar a API, se ela estiver ligada
        run: |
          DESIRED=$(aws ecs describe-services --cluster "$ECS_CLUSTER_NAME" --services "$ECS_SERVICE_NAME" --query 'services[0].desiredCount' --output text)
          echo "SERVICE_DESIRED=$DESIRED" >> "$GITHUB_ENV"
          if [ "$DESIRED" -gt 0 ]; then
            aws ecs wait services-stable --cluster "$ECS_CLUSTER_NAME" --services "$ECS_SERVICE_NAME"
          else
            echo "A API está desligada (0 tarefas); ela usa a imagem nova quando ligar."
          fi

      - name: Publicar a página
        run: |
          aws s3 sync frontend/ "s3://$FRONTEND_BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*" > /dev/null

      - name: Teste rápido
        if: env.SERVICE_DESIRED != '0'
        run: curl -fsS --retry 5 --retry-delay 10 "$CLOUDFRONT_URL/api/health"
