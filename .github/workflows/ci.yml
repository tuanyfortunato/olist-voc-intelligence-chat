# Lint e testes a cada PR. Não usa credenciais da AWS:
# os testes cobrem só o que não chama serviços externos.
name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # PostgreSQL com pgvector só para os testes do banco vetorial
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Formatação
        run: ruff format --check .

      - name: Testes
        run: pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir a imagem da API
        run: docker build -t olist-voc-api:ci .

      - name: Conferir que a API e os scripts funcionam dentro da imagem
        run: >-
          docker run --rm olist-voc-api:ci python -c
          "import src.api.main, scripts.load_vectors, scripts.calibrate_retrieval;
          from scripts.questions import load_questions; assert len(load_questions()) == 15"
