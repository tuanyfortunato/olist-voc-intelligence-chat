# Lint e testes a cada PR. Não usa credenciais da AWS:
# os testes cobrem só o que não chama serviços externos.
name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Formatação
        run: ruff format --check .

      - name: Testes
        run: pytest
