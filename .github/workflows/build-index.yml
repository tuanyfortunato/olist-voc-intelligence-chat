# Geração do índice do Chroma. Disparo manual.
# Modo prepare: baixa a base, prepara os documentos e mostra as contagens.
# Modo full: faz o mesmo, gera o índice e envia ao S3 junto com o manifesto.
# Se a indexação falhar no meio, o que já foi gravado fica em index/work/ no
# bucket, e a próxima execução continua dali.
name: Build index

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "prepare: só prepara a base e mostra os números; full: gera o índice e envia ao S3"
        type: choice
        options: [full, prepare]
        default: full

permissions:
  contents: read
  id-token: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Token do Kaggle
        run: |
          mkdir -p ~/.kaggle
          echo "${{ secrets.KAGGLE_ACCESS_TOKEN }}" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token

      - name: Baixar a base
        run: python -m scripts.download_data

      - name: Acesso à AWS pelo OIDC
        if: inputs.mode == 'full'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Recuperar uma indexação interrompida
        if: inputs.mode == 'full'
        run: aws s3 sync "s3://${{ vars.INDEX_BUCKET }}/index/work/" data/index/

      - name: Preparar a base e gerar o índice
        run: python -m scripts.build_index --mode ${{ inputs.mode }}

      - name: Enviar o índice ao S3
        if: inputs.mode == 'full'
        env:
          INDEX_BUCKET: ${{ vars.INDEX_BUCKET }}
        run: python -m scripts.upload_index

      - name: Guardar o progresso para a próxima execução
        if: failure() && inputs.mode == 'full'
        run: aws s3 sync data/index/ "s3://${{ vars.INDEX_BUCKET }}/index/work/"

      - name: Apagar o progresso parcial
        if: success() && inputs.mode == 'full'
        run: aws s3 rm --recursive "s3://${{ vars.INDEX_BUCKET }}/index/work/"

      - name: Tamanho do índice
        if: success() && inputs.mode == 'full'
        run: du -sh data/index

      - name: Guardar o resumo da preparação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepare-summary
          path: data/prepare_summary.json
          if-no-files-found: ignore
