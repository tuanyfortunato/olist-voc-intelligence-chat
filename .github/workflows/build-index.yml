# Geração do índice do Chroma. Disparo manual.
# Por enquanto só confirma o acesso à AWS pelo OIDC; a preparação e a
# indexação entram nas próximas etapas.
name: Build index

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "prepare: só prepara a base e mostra os números; full: gera o índice e envia ao S3"
        type: choice
        options: [full, prepare]
        default: full

permissions:
  contents: read
  id-token: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Acesso à AWS pelo OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Conta e papel em uso
        run: aws sts get-caller-identity
